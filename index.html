<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 Habit Tracker</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#242424;--muted:#77736d;--line:#dedbd5;--empty:#eceae5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1500px;margin:auto;padding:16px} header{display:block;margin-bottom:12px}.header-subrow{display:flex;justify-content:flex-start;align-items:baseline;gap:14px;margin-top:3px}
h1{font:400 28px Georgia,serif;letter-spacing:.08em;margin:0} p{margin:0;color:var(--muted);font-size:11px}.header-meta{text-align:right}.header-meta strong{display:block;font-size:12px;color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}.card:before{content:"";position:sticky;left:0;display:block;width:12px;height:0;z-index:20;background:var(--card);pointer-events:none}
.tracker{min-width:1390px;padding:12px} .monthbar,.row{display:grid;grid-template-columns:190px repeat(365,3px);align-items:center}
.monthbar{margin-bottom:7px;position:relative}.monthbar:before{display:none}.corner{font-size:9px;color:var(--muted);letter-spacing:.08em;position:sticky;left:0;z-index:40;background:var(--card);height:28px;display:flex;align-items:center;padding:0 12px;box-shadow:none;overflow:hidden}.corner:after{display:none}
.month{height:20px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border-radius:4px 4px 0 0;position:relative;z-index:1}
.row{margin:7px 0} .label{position:sticky;left:0;z-index:6;background:var(--card);min-height:30px;padding-left:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:6px;padding-right:8px;white-space:nowrap}.label:before{display:none}
.label b{font-size:11px;grid-column:1 / -1}.label.daily-label{display:flex;min-height:18px;height:18px;align-items:center;gap:6px}.label.daily-label b{grid-column:auto}.label span{font-size:10px;font-weight:400;color:var(--muted)}.label .subline{grid-column:1 / -1;display:flex;align-items:center;gap:6px;min-height:12px}
.day{display:block;width:3px;height:17px;background:var(--empty)} .day.na{opacity:.13} .day.future{opacity:.4}
.divider{height:1px;background:var(--line);margin:13px 0 9px 190px} .group{position:sticky;left:0;z-index:10;width:190px;background:var(--card);padding-left:12px;padding-right:8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.weekly-wrap{margin:8px 0 2px 0;display:flex;flex-direction:column;gap:7px}.weekly-item{padding-left:0}.weekly-item{display:flex;align-items:center;gap:9px;font-size:11px;position:sticky;left:0;z-index:2;background:var(--card);width:fit-content;padding-right:10px}.weekly-item b{min-width:110px}.weekly-dots{display:flex;gap:5px}.weekly-dot{width:11px;height:11px;border:1.5px solid var(--line);border-radius:50%;background:transparent}.weekly-count,.weekly-streak{font-size:10px;color:var(--muted)}.legend{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:9px;font-size:10px;color:var(--muted)} .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
@media(max-width:600px){main{padding:10px 7px}h1{font-size:22px}.header-subrow{align-items:baseline}.header-meta strong{font-size:11px}}
</style>
</head>
<body>
<main>
<header><h1>2026 · HABIT TRACKER</h1><div class="header-subrow"><p>Year at a glance</p><div class="header-meta"><strong id="dashboardDate"></strong></div></div></header>
<div class="card"><div class="tracker" id="tracker"><p>Loading habit data…</p></div></div>
<div class="legend" id="legend"></div>
</main>

<script>
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const FALLBACK = "#b7b7b7";

function isoDate(y,m,d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function parseISO(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y,m-1,d);
}
function easternTodayISO() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(new Date());
  const get = type => parts.find(p => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}
function daysInMonth(y,m) { return new Date(y,m,0).getDate(); }
function shortMD(s) { if(!s) return ""; const d=parseISO(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function dayOfYear(s) {
  const d=parseISO(s), start=new Date(d.getFullYear(),0,1);
  return Math.floor((d-start)/86400000)+1;
}
function manicureInfo(h,data) {
  const ym=data.lastUpdated.slice(0,7);
  const periods=new Set(h.completedPeriods||[]);
  const a=periods.has(ym+"-A"), b=periods.has(ym+"-B");
  return {ym,a,b,count:(a?1:0)+(b?1:0)};
}
function dayDiff(a,b) {
  return Math.round((parseISO(b)-parseISO(a))/86400000);
}
function currentDailyStreak(h) {
  if (!h.completeThrough) return 0;
  const missed = new Set(h.missedDates || []);
  let d = parseISO(h.completeThrough);
  const start = parseISO(h.streakStartDate || h.startDate);
  let n = 0;
  while (d >= start) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (missed.has(key)) break;
    n++;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function dailyStatus(h, data) {
  const today = parseISO(data.lastUpdated);
  const start = parseISO(h.startDate);
  if (start > today) return `Starts ${start.getMonth()+1}/${start.getDate()}`;
  const streak = currentDailyStreak(h);
  return streak ? `🔥 ${streak}` : "";
}
function isDailyComplete(h,date) {
  if ((h.completedDates || []).includes(date)) return true;
  if (!h.completeThrough) return false;
  const rangeStart=h.streakStartDate || h.startDate;
  return date >= rangeStart &&
         date <= h.completeThrough &&
         !(h.missedDates || []).includes(date);
}
function monthlyStreak(h, data) {
  const completed = new Set(h.completedMonths || []);
  let [y,m] = data.lastUpdated.slice(0,7).split("-").map(Number);
  const current=`${y}-${String(m).padStart(2,"0")}`;
  // An unfinished current month is pending, not a broken streak.
  if (!completed.has(current)) { m--; if(m===0){m=12;y--;} }
  let n=0;
  while (completed.has(`${y}-${String(m).padStart(2,"0")}`)) {
    n++; m--; if (m===0) {m=12;y--;}
  }
  return n;
}
function monthlyStatus(h,data) {
  if (h.frequency === "twice-monthly") {
    const ym=data.lastUpdated.slice(0,7);
    const periods=new Set(h.completedPeriods||[]);
    let [y,m]=ym.split("-").map(Number);
    let half = parseInt(data.lastUpdated.slice(8,10)) <= 15 ? "A" : "B";
    let key=`${y}-${String(m).padStart(2,"0")}-${half}`;
    // Current half can still be in progress; back up to the latest completed half.
    if (!periods.has(key)) {
      if (half==="B") half="A";
      else { half="B"; m--; if(m===0){m=12;y--;} }
      key=`${y}-${String(m).padStart(2,"0")}-${half}`;
    }
    let n=0;
    while(periods.has(key)) {
      n++;
      if (half==="B") half="A";
      else { half="B"; m--; if(m===0){m=12;y--;} }
      key=`${y}-${String(m).padStart(2,"0")}-${half}`;
    }
    if(!n) return "";
    const months=n/2;
    return `🔥 ${Number.isInteger(months)?months:months.toFixed(1)} months`;
  }
  const n=monthlyStreak(h,data);
  return n ? `🔥 ${n} month${n===1?"":"s"}` : "";
}
function monthlyComplete(h,m) {
  const ym=`2026-${String(m).padStart(2,"0")}`;
  if(h.frequency==="twice-monthly") {
    const p=new Set(h.completedPeriods||[]);
    return p.has(ym+"-A") && p.has(ym+"-B");
  }
  return (h.completedMonths||[]).includes(ym);
}


function startOfWeekSunday(date) {
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  d.setDate(d.getDate()-d.getDay());
  return d;
}
function weeklyInfo(h,data) {
  const asOf=parseISO(data.lastUpdated);
  const weekStart=startOfWeekSunday(asOf);
  const weekEnd=new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const dates=(h.completedDates||[]).map(parseISO);
  const count=dates.filter(d=>d>=weekStart && d<=weekEnd).length;
  const target=h.targetPerWeek||1;
  let streak=0;
  let cursor=new Date(weekStart);
  if(count>=target) {
    streak=1;
    cursor.setDate(cursor.getDate()-7);
  } else cursor.setDate(cursor.getDate()-7);
  while(cursor >= parseISO(h.startDate)) {
    const end=new Date(cursor); end.setDate(end.getDate()+6);
    const n=dates.filter(d=>d>=cursor && d<=end).length;
    if(n<target) break;
    streak++;
    cursor.setDate(cursor.getDate()-7);
  }
  return {count,target,streak,weekStart};
}

function trackingSummary(h,data) {
  const month=data.lastUpdated.slice(0,7);
  const entries=(h.entries||[]).filter(e=>e.date && e.date.startsWith(month));
  if(h.type==="choice") {
    const all=(h.entries||[]).filter(e=>e.date);
    if(!all.length) return "No entries yet";
    const up=all.filter(e=>e.value==="Up").length;
    const down=all.filter(e=>e.value==="Down").length;
    const hats=all.filter(e=>String(e.note||"").toLowerCase().includes("hat")).length;
    const pct=n=>Math.round((n/all.length)*100);
    return "Up "+pct(up)+"% · Down "+pct(down)+"% · Hat "+pct(hats)+"%";
  }
  if(h.type==="amount") {
    const total=entries.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
    return entries.length ? entries.length+"x · $"+total.toFixed(2)+" this month" : "No entries yet";
  }
  if(h.type==="occurrence") {
    const all=(h.entries||[]).filter(e=>e.date).map(e=>e.date).sort();
    if(!all.length) return "No entries yet";
    const start=parseISO(h.startDate || all[0]);
    const nowParts=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const part=t=>Number(nowParts.find(p=>p.type===t).value);
    const today=new Date(part("year"),part("month")-1,part("day"));
    const end=today.getFullYear()===data.year ? today : new Date(data.year,11,31);
    const labels=[];
    let cursor=new Date(start.getFullYear(),start.getMonth(),1);
    while(cursor<=end) {
      const y=cursor.getFullYear(), m=cursor.getMonth();
      const monthStart=new Date(y,m,1);
      const monthEnd=new Date(y,m+1,0);
      const denomStart=(y===start.getFullYear()&&m===start.getMonth()) ? start : monthStart;
      const denomEnd=(y===end.getFullYear()&&m===end.getMonth()) ? end : monthEnd;
      const days=Math.max(0,Math.floor((denomEnd-denomStart)/86400000)+1);
      const prefix=y+"-"+String(m+1).padStart(2,"0");
      const count=all.filter(d=>d.startsWith(prefix)).length;
      const pct=days ? Math.round(count/days*100) : 0;
      labels.push(new Intl.DateTimeFormat("en-US",{month:"short"}).format(cursor)+" "+pct+"%");
      cursor=new Date(y,m+1,1);
    }
    const overallDays=Math.max(1,Math.floor((end-start)/86400000)+1);
    const overallCount=all.filter(d=>parseISO(d)>=start && parseISO(d)<=end).length;
    labels.push("Overall "+Math.round(overallCount/overallDays*100)+"%");
    return labels.join(" · ");
  }
  if(h.id==="movement-type" || h.type==="multi-choice") {
    const all=(h.entries||[]).filter(e=>e.date);
    if(!all.length) return "No entries yet";
    const movementDays=new Set(all.map(e=>e.date));
    const daysFor=value=>new Set(all.filter(e=>e.value===value).map(e=>e.date));
    const pct=value=>Math.round(daysFor(value).size/movementDays.size*100);
    const lower=daysFor("Lower Body Strength"), upper=daysFor("Upper Body Strength");
    const strength=new Set([...lower,...upper]);
    const strengthPct=Math.round(strength.size/movementDays.size*100);
    const strengthSessions=lower.size+upper.size;
    const lowerSplit=strengthSessions?Math.round(lower.size/strengthSessions*100):0;
    const upperSplit=strengthSessions?100-lowerSplit:0;
    return "Walk "+pct("Walk")+"%<br>Strength "+strengthPct+"% <span class=\"movement-split\">(Lower "+lowerSplit+"% / Upper "+upperSplit+"%)</span><br>Spin "+pct("Spin")+"% · Pickleball "+pct("Pickleball")+"%";
  }
  return entries.length ? entries.length+"x this month" : "No entries yet";
}
function trackingDates(h) {
  return new Set((h.entries||[]).map(e=>e.date).filter(Boolean));
}

async function render() {
  const res = await fetch("./data.json?ts="+Date.now(), {cache:"no-store"});
  if(!res.ok) throw new Error("Could not load data.json");
  const data = await res.json();
  const year = data.year;
  const asOf=parseISO(data.lastUpdated);
  // Header date follows the real calendar day in Eastern Time.
  // Habit completion/status still uses data.lastUpdated, preserving unconfirmed days.
  function updateDashboardDate() {
    document.getElementById("dashboardDate").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York",
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    }).format(new Date());
  }
  updateDashboardDate();
  if (!window.dashboardDateTimer) {
    window.dashboardDateTimer = setInterval(updateDashboardDate, 30000);
  }
  const tracker=document.getElementById("tracker");
  tracker.innerHTML="";

  const bar=document.createElement("div");
  bar.className="monthbar";
  const corner=document.createElement("div");
  corner.className="corner";
  corner.textContent="HABIT · CURRENT STREAK";
  bar.appendChild(corner);
  let col=2;
  for(let m=1;m<=12;m++) {
    const n=daysInMonth(year,m);
    const el=document.createElement("div");
    el.className="month";
    el.style.gridColumn=`${col} / span ${n}`;
    const c=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
    el.style.background=c;
    el.style.color=(m===5)?"#443f2e":"#fff";
    el.style.opacity=data.monthColors[String(m).padStart(2,"0")] ? "1" : ".35";
    el.textContent=MONTHS[m-1];
    bar.appendChild(el); col+=n;
  }
  tracker.appendChild(bar);

  const dgroup=document.createElement("div"); dgroup.className="group"; dgroup.textContent="Daily"; tracker.appendChild(dgroup);

  for(const h of data.dailyHabits) {
    const row=document.createElement("div"); row.className="row";
    const label=document.createElement("div"); label.className="label daily-label";
    const todayISO=easternTodayISO();
    const doneToday=isDailyComplete(h,todayISO);
    const todayMonth=todayISO.slice(5,7);
    const check=doneToday ? ` <span style="color:${data.monthColors[todayMonth] || FALLBACK};font-weight:700">✓</span>` : "";
    label.innerHTML=`<b>${h.name}</b><span>${dailyStatus(h,data)}${check}</span>`;
    row.appendChild(label);
    for(let m=1;m<=12;m++) for(let d=1;d<=daysInMonth(year,m);d++) {
      const date=isoDate(year,m,d), cell=document.createElement("span");
      cell.className="day"; cell.title=`${MONTHS[m-1]} ${d}`;
      if(date < h.startDate) cell.classList.add("na");
      else if(isDailyComplete(h,date)) cell.style.background=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
      else if(date > data.lastUpdated) cell.classList.add("future");
      row.appendChild(cell);
    }
    tracker.appendChild(row);
  }


  if ((data.weeklyGoals||[]).length) {
    const wdiv=document.createElement("div"); wdiv.className="divider"; tracker.appendChild(wdiv);
    const wgroup=document.createElement("div"); wgroup.className="group"; wgroup.textContent="Weekly"; tracker.appendChild(wgroup);
    for(const h of data.weeklyGoals) {
      const info=weeklyInfo(h,data);
      const row=document.createElement("div"); row.className="row";
      const label=document.createElement("div"); label.className="label";
      label.style.gap="7px";
      const name=document.createElement("b"); name.textContent=h.name; label.appendChild(name);
      const sub=document.createElement("span"); sub.className="subline";
      const dots=document.createElement("span"); dots.className="weekly-dots";
      const currentColor=data.monthColors[String(info.weekStart.getMonth()+1).padStart(2,"0")] || FALLBACK;
      for(let i=0;i<info.target;i++) {
        const dot=document.createElement("i"); dot.className="weekly-dot";
        if(i<info.count){dot.style.background=currentColor;dot.style.borderColor=currentColor;}
        dots.appendChild(dot);
      }
      sub.appendChild(dots);
      const count=document.createElement("span"); count.className="weekly-count"; count.textContent=info.count+"/"+info.target; sub.appendChild(count);
      if(info.streak){const st=document.createElement("span");st.className="weekly-streak";st.textContent="🔥 "+info.streak;sub.appendChild(st);}
      const latestWeekly=(h.completedDates||[]).slice().sort().pop();
      if(latestWeekly){const ld=document.createElement("span");ld.className="weekly-streak";ld.textContent="("+shortMD(latestWeekly)+")";sub.appendChild(ld);}
      label.appendChild(sub);
      row.appendChild(label);

      const completed=(h.completedDates||[]).map(parseISO);
      const target=h.targetPerWeek||1;
      for(let m=1;m<=12;m++) for(let d=1;d<=daysInMonth(year,m);d++) {
        const dateObj=new Date(year,m-1,d);
        const date=isoDate(year,m,d);
        const cell=document.createElement("span"); cell.className="day"; cell.title=`${MONTHS[m-1]} ${d}`;
        if(date < h.startDate) cell.classList.add("na");
        else {
          const isActualCompletion=(h.completedDates||[]).includes(date);
          const ws=startOfWeekSunday(dateObj);
          const we=new Date(ws); we.setDate(we.getDate()+6);
          const n=completed.filter(x=>x>=ws && x<=we).length;
          // Always show actual completion dates; if the weekly target was met,
          // also color the rest of that successful week.
          if(isActualCompletion || n>=target) cell.style.background=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
          else if(date > data.lastUpdated) cell.classList.add("future");
        }
        row.appendChild(cell);
      }
      tracker.appendChild(row);
    }
  }

  const div=document.createElement("div"); div.className="divider"; tracker.appendChild(div);
  const group=document.createElement("div"); group.className="group"; group.textContent="Monthly / recurring"; tracker.appendChild(group);

  for(const h of data.monthlyHabits) {
    const row=document.createElement("div"); row.className="row";
    const label=document.createElement("div"); label.className="label";
    const status=monthlyStatus(h,data);
    const name=document.createElement("b"); name.textContent=h.name; label.appendChild(name);
    const sub=document.createElement("span"); sub.className="subline";
    if(h.frequency==="twice-monthly") {
      const mi=manicureInfo(h,data);
      const dots=document.createElement("span"); dots.className="weekly-dots";
      const c=data.monthColors[data.lastUpdated.slice(5,7)] || FALLBACK;
      for(const done of [mi.a,mi.b]) {
        const dot=document.createElement("i"); dot.className="weekly-dot";
        if(done){dot.style.background=c;dot.style.borderColor=c;}
        dots.appendChild(dot);
      }
      sub.appendChild(dots);
      const count=document.createElement("span"); count.textContent=mi.count+"/2"; sub.appendChild(count);
    }
    if(status){const st=document.createElement("span");st.textContent=status;sub.appendChild(st);}
    const exactDates=[...(h.completedDates||[])];
    if(h.completedPeriodsDetailed) exactDates.push(...h.completedPeriodsDetailed.map(x=>x.date).filter(Boolean));
    const latestExact=exactDates.sort().pop();
    if(latestExact){const ld=document.createElement("span");ld.textContent="("+shortMD(latestExact)+")";sub.appendChild(ld);}
    if(sub.childNodes.length) label.appendChild(sub);
    row.appendChild(label);
    for(let m=1;m<=12;m++) for(let d=1;d<=daysInMonth(year,m);d++) {
      const cell=document.createElement("span"); cell.className="day"; cell.title=`${MONTHS[m-1]} ${d}`;
      const ym=`${year}-${String(m).padStart(2,"0")}`;
      if(h.frequency==="twice-monthly") {
        const p=new Set(h.completedPeriods||[]);
        const half=d<=15?"A":"B";
        if(p.has(ym+"-"+half)) cell.style.background=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
        else if(ym > data.lastUpdated.slice(0,7)) cell.classList.add("future");
      } else if(monthlyComplete(h,m)) cell.style.background=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
      else if(ym > data.lastUpdated.slice(0,7)) cell.classList.add("future");
      row.appendChild(cell);
    }
    tracker.appendChild(row);
  }

  if ((data.trackingItems||[]).length) {
    const tdiv=document.createElement("div"); tdiv.className="divider"; tracker.appendChild(tdiv);
    const tgroup=document.createElement("div"); tgroup.className="group"; tgroup.textContent="Tracking"; tracker.appendChild(tgroup);

    for(const h of data.trackingItems) {
      const row=document.createElement("div"); row.className="row";
      const label=document.createElement("div"); label.className="label";
      const name=document.createElement("b"); name.textContent=h.name; label.appendChild(name);
      const sub=document.createElement("span"); sub.className="subline";
      const summary=document.createElement("span"); summary.innerHTML=trackingSummary(h,data); sub.appendChild(summary);
      label.appendChild(sub); row.appendChild(label);

      const dates=trackingDates(h);
      for(let m=1;m<=12;m++) for(let d=1;d<=daysInMonth(year,m);d++) {
        const date=isoDate(year,m,d), cell=document.createElement("span");
        cell.className="day"; cell.title=`${MONTHS[m-1]} ${d}`;
        if(date < h.startDate) cell.classList.add("na");
        else if(dates.has(date)) cell.style.background=data.monthColors[String(m).padStart(2,"0")] || FALLBACK;
        else if(date > data.lastUpdated) cell.classList.add("future");
        else cell.style.opacity=".22";
        row.appendChild(cell);
      }
      tracker.appendChild(row);
    }
  }

  const legend=document.getElementById("legend"); legend.innerHTML="";
  for(let m=1;m<=12;m++) {
    const c=data.monthColors[String(m).padStart(2,"0")];
    if(!c) continue;
    const item=document.createElement("span");
    item.innerHTML=`<i style="background:${c}"></i>${MONTHS[m-1]}`;
    legend.appendChild(item);
  }
}
render().catch(err => {
  document.getElementById("tracker").innerHTML="<p>Habit data could not be loaded. Please refresh the page.</p>";
  console.error(err);
});
</script>
</body></html>
